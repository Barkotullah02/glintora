<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Create account')}"></head>
<body>

<div th:replace="~{layout :: header}"></div>

<div class="auth-wrap">
    <p class="eyebrow" style="text-align:center;">Join Glintora</p>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Save your details for a quicker checkout and order history.</p>

    <div class="notice notice-error" th:if="${registerError}" th:text="${registerError}"></div>

    <form th:action="@{/register}" method="post">
        <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" class="input" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="input" required>
        </div>
        <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" class="input" placeholder="+8801XXXXXXXXX">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="input" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
    </form>

    <p class="auth-alt">Already have an account? <a th:href="@{/login}">Sign in</a></p>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
