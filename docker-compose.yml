# Local PostgreSQL for Glintora.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: glintora-postgres
    environment:
      POSTGRES_DB: glintora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - glintora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glintora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  glintora_pgdata:
