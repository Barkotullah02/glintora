<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Men's collection">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAE7DF"/>
      <stop offset="1" stop-color="#DDD9CE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#mbg)"/>
  <path d="M160 1000 V420 a240 240 0 0 1 480 0 V1000 Z" fill="#E3E0D6"/>

  <g>
    <circle cx="400" cy="280" r="46" fill="#252525" opacity="0.85"/>
    <!-- panjabi: straight-cut long kurta -->
    <path d="M400 334
             c-78 0 -132 40 -152 116
             l-56 550 h416
             l-56 -550
             c-20 -76 -74 -116 -152 -116 Z"
          fill="#252525"/>
    <!-- placket + buttons -->
    <rect x="392" y="334" width="16" height="300" fill="#F8F7F4" opacity="0.14"/>
    <g fill="#87917C">
      <circle cx="400" cy="380" r="5"/>
      <circle cx="400" cy="430" r="5"/>
      <circle cx="400" cy="480" r="5"/>
    </g>
    <!-- hem embroidery band -->
    <rect x="212" y="800" width="376" height="26" fill="#87917C" opacity="0.55"/>
    <g stroke="#F8F7F4" stroke-width="1.6" fill="none" opacity="0.5">
      <path d="M224 813 h352 M244 806 l10 14 M284 806 l10 14 M324 806 l10 14 M364 806 l10 14 M404 806 l10 14 M444 806 l10 14 M484 806 l10 14 M524 806 l10 14 M564 806 l10 14"/>
    </g>
  </g>

  <ellipse cx="400" cy="940" rx="200" ry="16" fill="#252525" opacity="0.05"/>
</svg>
